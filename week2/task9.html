Create a program that makes an API call and displays all the retrieved data on a web page. Choose a public API (e.g., JSONPlaceholder, OpenWeatherMap) and use the fetch function to make the API request. Also implement error handling

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9</title>
</head>
<body>
    <div class="container">
        <h1>Fetch Data Using API</h1>
        <button id="button">Trigger Data Call</button>
        <p id="message"></p>
        <div id="dataContainer"></div>
    </div>
    <script>
        document.getElementById("button").addEventListener("click", fetchData);

        async function fetchData() {
            document.getElementById('message'); 
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts');
                if (!response.ok) {
                    console.log(Error);
                }
                const data = await response.json();
                displayData(data);
                document.getElementById('message');
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('message');
            }
        }

        function displayData(data) {
            const container = document.getElementById('dataContainer');
            container.innerHTML = '';
            data.forEach(item => {
                const post = document.createElement('div');
                post.innerHTML = `<h3>${item.title}</h3><p>${item.body}</p>`;
                container.appendChild(post);
            });
        }
    </script>
</body>
</html>
