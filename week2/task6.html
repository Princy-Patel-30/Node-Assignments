<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6</title>
</head>
<body>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <p id="print"></p>

    <script>
        let Id;
        let count = 0; 

        function print() {
            for (let i = 1; i <= 5; i++) {
                (function(i) {  
                    setTimeout(function() {
                        count++;  
                        document.getElementById("print").textContent = count;
                    }, i * 1000);  
                })(i); 
            }
        }

        function stopprint() {
            clearInterval(Id); 
        }

        document.getElementById("start").addEventListener("click", print);
        document.getElementById("stop").addEventListener("click", stopprint);

    </script>
</body>
</html>
